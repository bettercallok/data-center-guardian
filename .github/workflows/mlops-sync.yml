name: Continuous Training MLOps Pipeline
on:
  schedule:
    # Run at 00:00 on the 1st of every 3rd month (Quarterly)
    - cron: '0 0 1 */3 *'
  push:
    branches: [ main ]
    paths:
      - 'src/ml/**'
      - 'src/etl/**'
  workflow_dispatch:

permissions:
  contents: write

# Never let two training runs race to push model artifacts.
concurrency:
  group: mlops-continuous-training
  cancel-in-progress: false

jobs:
  continuous-training:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Extract & Process Telemetry (ETL)
        # Fetches the newest Backblaze quarter. Exits non-zero on any failure,
        # so a broken download can never produce a model trained on fake data.
        run: python src/etl/pipeline.py

      - name: Train XGBoost & Export
        # Includes a data quality gate (minimum drives / failures).
        run: python src/ml/train_survival.py --cpu

      - name: Validate new model against the test-suite
        run: python -m pytest -q

      - name: Commit Updated Model Artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f src/api/survival_model.json
          git add -f data/processed/telemetry.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to model artifacts."
          else
            git commit -m "chore(mlops): automated continuous training model update"
            git push
          fi
